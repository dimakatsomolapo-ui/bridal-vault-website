<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridal Vault | Couture Bridal Atelier</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<meta property="og:title" content="Bridal Vault | Couture Bridal Atelier">
<meta property="og:description" content="Luxury bridal refinement, alterations and private couture fittings.">
<meta property="og:image" content="https://bridal-vault.netlify.app/preview.png">
<meta property="og:url" content="https://bridal-vault.netlify.app/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bridal-vault.netlify.app/preview.png">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Inter',sans-serif;
background:#f8f5f0;
color:#1c1c1c;
overflow-x:hidden;
animation:pageFade 1.2s ease;
}

@keyframes pageFade{
from{opacity:0;}
to{opacity:1;}
}

/* WATERMARK */

body::before{
content:"";
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:65vw;
height:65vw;
max-width:800px;
max-height:800px;
background:url('BV.jpeg') center/contain no-repeat;
opacity:0.06;
pointer-events:none;
z-index:0;
}

/* HEADER */

header{
position:absolute;
top:0;
left:0;
width:100%;
padding:35px 6%;
display:flex;
justify-content:space-between;
align-items:center;
z-index:10;
}

.logo{
font-family:'Playfair Display',serif;
font-size:18px;
letter-spacing:8px;
background:linear-gradient(90deg,#c2a14a,#fff3c9,#c2a14a);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:goldShimmer 6s linear infinite;
}

@keyframes goldShimmer{
to{background-position:200% center;}
}

nav{
display:flex;
gap:30px;
flex-wrap:wrap;
}

nav a{
text-decoration:none;
color:#333;
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

nav a:hover{
color:#c2a14a;
}

/* HERO */

.hero{
min-height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

/* VIDEO STYLE HERO USING IMAGE + MOTION */

.hero-bg{
position:absolute;
inset:0;
background:url('hero.png') center/cover no-repeat;
animation:slowZoom 18s ease-in-out infinite alternate;
z-index:1;
}

@keyframes slowZoom{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to bottom,
rgba(248,245,240,0.25),
rgba(248,245,240,0.55)
);
z-index:2;
}

/* PETALS */

.petals{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:3;
overflow:hidden;
}

.petal{
position:absolute;
top:-40px;
width:18px;
height:18px;
background:radial-gradient(circle,#f5cbd6,#e8a6b2);
border-radius:60% 40% 60% 40%;
opacity:.85;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:.8;
}
}

/* FLOATING LIGHT */

.particles span{
position:absolute;
width:4px;
height:4px;
background:#ffffff;
border-radius:50%;
opacity:.6;
animation:floatLight 6s linear infinite;
z-index:3;
}

@keyframes floatLight{
0%{
transform:translateY(0);
opacity:0;
}
50%{
opacity:.8;
}
100%{
transform:translateY(-200px);
opacity:0;
}
}

/* HERO CONTENT */

.hero-content{
position:relative;
z-index:5;
max-width:900px;
padding:0 20px;
}

.hero-subtitle{
font-size:12px;
letter-spacing:4px;
text-transform:uppercase;
margin-bottom:20px;
color:#5a4a2d;
}

.hero h1{
font-family:'Playfair Display',serif;
font-size:clamp(42px,7vw,82px);
font-weight:400;
line-height:1.1;
margin-bottom:25px;
}

.hero p{
font-size:clamp(15px,2vw,18px);
max-width:700px;
margin:0 auto 40px;
color:#444;
line-height:1.8;
}

.button{
display:inline-block;
background:#c2a14a;
color:white;
padding:18px 44px;
text-decoration:none;
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}

.button:hover{
background:#a88834;
transform:translateY(-2px);
}

/* LUXURY SCROLL INDICATOR */

.scroll-indicator{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
z-index:5;
font-size:11px;
letter-spacing:3px;
text-transform:uppercase;
color:#666;
}

/* MOBILE */

@media(max-width:768px){

header{
padding:25px 6%;
}

.logo{
font-size:15px;
letter-spacing:4px;
}

nav{
gap:15px;
}

nav a{
font-size:10px;
letter-spacing:1px;
}

.hero h1{
font-size:38px;
}

.hero-subtitle{
font-size:10px;
letter-spacing:2px;
}

.hero p{
font-size:14px;
}

.scroll-indicator{
font-size:9px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">BRIDAL VAULT</div>

<nav>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
<a href="booking.html">Book</a>
</nav>

</header>

<section class="hero">

<div class="hero-bg"></div>

<div class="petals" id="petals"></div>
<div class="particles" id="particles"></div>

<div class="hero-content">

<div class="hero-subtitle">
Private Bridal Atelier
</div>

<h1>
Where Bridal Elegance<br>
Becomes Personal
</h1>

<p>
Luxury bridal alterations, couture refinement and private fittings
designed to ensure your gown feels as extraordinary as the moment itself.
</p>

<a href="booking.html" class="button">
Reserve Private Consultation
</a>

</div>

<div class="scroll-indicator">
Scroll to Discover
</div>

</section>

<script>

/* PETALS */

const container = document.getElementById("petals");

function createPetal(){

const petal = document.createElement("div");
petal.classList.add("petal");

petal.style.left = Math.random()*100 + "vw";
petal.style.animationDuration = (Math.random()*4 + 4) + "s";

container.appendChild(petal);

setTimeout(()=>{
petal.remove();
},8000);

}

let petalInterval = setInterval(createPetal,300);

setTimeout(()=>{
clearInterval(petalInterval);
},8000);


/* LIGHT PARTICLES */

const particles = document.querySelector(".particles");

for(let i=0;i<25;i++){

const dot = document.createElement("span");

dot.style.left = Math.random()*100 + "%";
dot.style.top = Math.random()*100 + "%";
dot.style.animationDuration = (Math.random()*5 + 3) + "s";

particles.appendChild(dot);

}

</script>

</body>
</html>
